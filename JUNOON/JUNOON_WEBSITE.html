<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUNOON — Premium Clothing</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }

  body {
    background:#0d0d0d;
    color:#fff;
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }

  /* ── NAVBAR ── */
  nav {
    position:sticky; top:0; z-index:100;
    background:rgba(13,13,13,0.97);
    border-bottom:1px solid #1f1f1f;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 2.5rem; height:66px;
  }
  .logo {
    font-size:1.25rem; font-weight:800; letter-spacing:2px;
    color:#fff; text-transform:uppercase; text-decoration:none;
  }
  .nav-links { display:flex; gap:2.2rem; align-items:center; }
  .nav-links a {
    color:#ccc; font-size:0.92rem; font-weight:400;
    text-decoration:none; transition:color .2s; cursor:pointer;
  }
  .nav-links a:hover { color:#fff; }
  .cart-btn {
    background:#e8423a; color:#fff; border:none;
    padding:0.55rem 1.3rem; border-radius:6px;
    font-family:'Inter',sans-serif; font-size:0.88rem; font-weight:600;
    cursor:pointer; display:flex; align-items:center; gap:0.5rem;
    transition:background .2s;
  }
  .cart-btn:hover { background:#cf3830; }

  /* ── HERO ── */
  .hero {
    min-height:580px;
    background: radial-gradient(ellipse at 70% 50%, #1f1c1c 0%, #0d0d0d 60%),
                radial-gradient(ellipse at 30% 60%, #1a1a1a 0%, transparent 60%);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; text-align:center;
    padding:4rem 2rem;
    position:relative; overflow:hidden;
  }
  .hero::before {
    content:'';
    position:absolute; inset:0;
    background:radial-gradient(ellipse 60% 50% at 50% 50%, rgba(232,66,58,0.06) 0%, transparent 70%);
    pointer-events:none;
  }
  .hero h1 {
    font-size:clamp(2.8rem,7vw,5.5rem);
    font-weight:800; line-height:1.1;
    color:#fff; letter-spacing:-1px;
    margin-bottom:1.2rem;
  }
  .hero p {
    font-size:1rem; color:#999; font-weight:400;
    margin-bottom:2.2rem; letter-spacing:.5px;
  }
  .hero-btn {
    background:#e8423a; color:#fff; border:none;
    padding:0.85rem 2.5rem; border-radius:6px;
    font-family:'Inter',sans-serif; font-size:1rem; font-weight:600;
    cursor:pointer; transition:background .2s, transform .15s;
  }
  .hero-btn:hover { background:#cf3830; transform:translateY(-1px); }

  /* ── STATS ── */
  .stats {
    display:flex; background:#111;
    border-top:1px solid #1f1f1f; border-bottom:1px solid #1f1f1f;
  }
  .stat {
    flex:1; padding:1.4rem 1rem; text-align:center;
    border-right:1px solid #1f1f1f; transition:background .2s;
  }
  .stat:last-child { border-right:none; }
  .stat:hover { background:#161616; }
  .stat-val {
    font-size:1.65rem; font-weight:700; color:#e8423a;
    font-variant-numeric:tabular-nums;
  }
  .stat-lbl { font-size:0.7rem; color:#666; margin-top:3px; letter-spacing:1.5px; text-transform:uppercase; }

  /* ── SEARCH + FILTERS ── */
  .search-area {
    padding:3rem 2.5rem 1.5rem;
    display:flex; flex-direction:column; align-items:center; gap:1.2rem;
  }
  .search-wrap { position:relative; width:100%; max-width:520px; }
  .search-input {
    width:100%; background:#161616; border:1.5px solid #2a2a2a;
    color:#fff; font-family:'Inter',sans-serif; font-size:0.9rem;
    padding:0.85rem 1rem 0.85rem 2.8rem; border-radius:6px; outline:none;
    transition:border-color .2s;
  }
  .search-input::placeholder { color:#555; }
  .search-input:focus { border-color:#e8423a; }
  .search-ico { position:absolute; left:0.9rem; top:50%; transform:translateY(-50%); color:#555; font-size:0.95rem; pointer-events:none; }
  .filters { display:flex; gap:0.6rem; flex-wrap:wrap; justify-content:center; }
  .f-tag {
    padding:0.4rem 1.1rem; background:transparent;
    border:1.5px solid #2a2a2a; color:#888;
    font-family:'Inter',sans-serif; font-size:0.78rem; font-weight:500;
    border-radius:4px; cursor:pointer; transition:all .2s; letter-spacing:.5px;
  }
  .f-tag:hover { border-color:#e8423a; color:#e8423a; }
  .f-tag.active { border-color:#e8423a; color:#fff; background:#e8423a; }

  /* ── SECTION TITLE ── */
  .sec-head {
    padding:1.5rem 2.5rem 1.2rem;
    display:flex; align-items:baseline; justify-content:space-between;
  }
  .sec-title { font-size:1.5rem; font-weight:700; color:#fff; }
  .sec-count { font-size:0.78rem; color:#666; letter-spacing:1px; }

  /* ── PRODUCT GRID ── */
  .grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(270px,1fr));
    gap:1.5rem; padding:0 2.5rem 4rem;
  }

  .card {
    background:#141414; border:1px solid #1f1f1f;
    border-radius:10px; overflow:hidden;
    transition:transform .25s, border-color .25s, box-shadow .25s;
    display:flex; flex-direction:column;
    animation:fadeUp .5s ease both;
  }
  .card:nth-child(1){animation-delay:.04s} .card:nth-child(2){animation-delay:.08s}
  .card:nth-child(3){animation-delay:.12s} .card:nth-child(4){animation-delay:.16s}
  .card:nth-child(5){animation-delay:.20s} .card:nth-child(6){animation-delay:.24s}
  .card:nth-child(7){animation-delay:.28s} .card:nth-child(8){animation-delay:.32s}

  .card:hover {
    transform:translateY(-5px);
    border-color:#e8423a;
    box-shadow:0 12px 30px rgba(232,66,58,0.12);
  }

  .card-img {
    width:100%; height:300px; object-fit:cover;
    display:block; transition:transform .4s ease;
    background:#1a1a1a;
  }
  .card:hover .card-img { transform:scale(1.04); }
  .card-img-wrap { overflow:hidden; position:relative; }

  .card-badges { position:absolute; top:10px; left:10px; display:flex; gap:6px; }
  .badge {
    font-size:0.65rem; font-weight:700; letter-spacing:1px;
    padding:3px 9px; border-radius:3px; text-transform:uppercase;
  }
  .badge-new { background:#e8423a; color:#fff; }
  .badge-sale { background:#000; border:1px solid #e8423a; color:#e8423a; }

  .card-body { padding:1.1rem 1.2rem 1.4rem; flex:1; display:flex; flex-direction:column; }
  .card-cat { font-size:0.68rem; color:#e8423a; font-weight:600; letter-spacing:2px; text-transform:uppercase; margin-bottom:0.3rem; }
  .card-name { font-size:1.05rem; font-weight:700; color:#f5f5f5; margin-bottom:0.4rem; line-height:1.3; }
  .card-desc { font-size:0.78rem; color:#777; line-height:1.65; margin-bottom:0.9rem; flex:1; }
  .card-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:0.9rem; }
  .card-price { font-size:1.2rem; font-weight:700; color:#fff; }
  .card-stars { font-size:0.75rem; color:#888; }
  .add-btn {
    width:100%; padding:0.7rem; background:transparent;
    border:1.5px solid #2a2a2a; color:#ccc;
    font-family:'Inter',sans-serif; font-size:0.8rem; font-weight:600;
    border-radius:5px; cursor:pointer; transition:all .2s; letter-spacing:.5px;
  }
  .add-btn:hover { background:#e8423a; border-color:#e8423a; color:#fff; }
  .add-btn.added { background:#e8423a; border-color:#e8423a; color:#fff; }

  .no-res {
    grid-column:1/-1; text-align:center;
    padding:5rem 1rem; color:#555;
  }
  .no-res-icon { font-size:2.5rem; margin-bottom:1rem; }
  .no-res p { font-size:0.82rem; letter-spacing:1.5px; text-transform:uppercase; }

  /* ── CART DRAWER ── */
  .overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.8);
    z-index:300; opacity:0; pointer-events:none; transition:opacity .3s;
  }
  .overlay.open { opacity:1; pointer-events:all; }

  .drawer {
    position:fixed; right:0; top:0; bottom:0;
    width:min(430px,100vw);
    background:#111; border-left:1px solid #1f1f1f;
    z-index:301; display:flex; flex-direction:column;
    transform:translateX(100%); transition:transform .35s cubic-bezier(.4,0,.2,1);
  }
  .drawer.open { transform:translateX(0); }

  .drawer-top {
    padding:1.5rem 1.5rem 1.2rem;
    border-bottom:1px solid #1f1f1f;
    display:flex; align-items:center; justify-content:space-between;
  }
  .drawer-title { font-size:1.2rem; font-weight:700; color:#fff; }
  .drawer-close {
    background:transparent; border:1.5px solid #2a2a2a; color:#888;
    width:34px; height:34px; border-radius:5px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:1rem; transition:all .2s;
  }
  .drawer-close:hover { border-color:#e8423a; color:#e8423a; }

  .drawer-body { flex:1; overflow-y:auto; padding:1rem 1.2rem; }
  .drawer-empty { text-align:center; padding:4rem 1rem; color:#555; }
  .drawer-empty-icon { font-size:2.5rem; margin-bottom:1rem; opacity:.4; }
  .drawer-empty p { font-size:0.75rem; letter-spacing:2px; text-transform:uppercase; }

  .ci {
    display:flex; gap:0.9rem; padding:1rem;
    background:#161616; border:1px solid #1f1f1f;
    border-radius:8px; margin-bottom:0.8rem;
    transition:border-color .2s;
  }
  .ci:hover { border-color:#2a2a2a; }
  .ci img {
    width:72px; height:80px; object-fit:cover;
    border-radius:5px; background:#1a1a1a; flex-shrink:0;
  }
  .ci-info { flex:1; }
  .ci-name { font-size:0.9rem; font-weight:600; color:#f0f0f0; line-height:1.3; }
  .ci-price { font-size:0.82rem; color:#e8423a; margin-top:3px; font-weight:600; }
  .ci-ctrl { display:flex; align-items:center; gap:0.5rem; margin-top:0.6rem; }
  .q-btn {
    width:26px; height:26px; background:transparent;
    border:1px solid #2a2a2a; color:#ccc;
    border-radius:4px; cursor:pointer; font-size:1rem;
    display:flex; align-items:center; justify-content:center;
    transition:all .2s;
  }
  .q-btn:hover { border-color:#e8423a; color:#e8423a; }
  .q-n { font-size:0.85rem; font-weight:700; min-width:22px; text-align:center; color:#fff; }
  .ci-rm {
    background:transparent; border:none; color:#555; cursor:pointer;
    font-size:0.72rem; margin-left:auto; text-transform:uppercase;
    letter-spacing:.5px; font-family:inherit; transition:color .2s;
  }
  .ci-rm:hover { color:#e8423a; }

  .drawer-foot { padding:1.3rem 1.5rem; border-top:1px solid #1f1f1f; }
  .total-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
  .total-lbl { font-size:0.8rem; color:#777; letter-spacing:1px; text-transform:uppercase; }
  .total-val { font-size:1.5rem; font-weight:700; color:#fff; }
  .checkout-btn {
    width:100%; padding:0.9rem; background:#e8423a; color:#fff; border:none;
    border-radius:6px; font-family:'Inter',sans-serif; font-size:0.9rem;
    font-weight:700; cursor:pointer; transition:background .2s; letter-spacing:.5px;
  }
  .checkout-btn:hover { background:#cf3830; }

  /* ── TOAST ── */
  .toast {
    position:fixed; bottom:2rem; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#161616; border:1px solid #e8423a; color:#fff;
    padding:0.7rem 1.8rem; border-radius:6px;
    font-size:0.8rem; font-weight:500; letter-spacing:.5px;
    z-index:500; opacity:0; pointer-events:none;
    transition:opacity .3s, transform .3s; white-space:nowrap;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ── FOOTER ── */
  footer {
    border-top:1px solid #1f1f1f;
    padding:2rem 2.5rem;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem;
    background:#0d0d0d;
  }
  .foot-logo { font-size:1.1rem; font-weight:800; letter-spacing:2px; color:#fff; }
  .foot-txt { font-size:0.72rem; color:#555; letter-spacing:1px; }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(16px); }
    to   { opacity:1; transform:translateY(0); }
  }

  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-track { background:#0d0d0d; }
  ::-webkit-scrollbar-thumb { background:#2a2a2a; border-radius:2px; }

  @media(max-width:700px) {
    nav { padding:0 1rem; }
    .nav-links { gap:1.2rem; }
    .hero h1 { font-size:2.4rem; }
    .search-area, .sec-head { padding-left:1rem; padding-right:1rem; }
    .grid { padding:0 1rem 3rem; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:1rem; }
    .card-img { height:200px; }
    .stats { flex-wrap:nowrap; overflow-x:auto; }
    .stat { min-width:110px; }
    footer { padding:1.5rem 1rem; }
  }
</style>
</head>
<body>

<!-- NAVBAR -->
<nav>
  <a class="logo" href="#">JUNOON</a>
  <div class="nav-links">
    <a onclick="scrollToTop()">Home</a>
    <a onclick="scrollToShop()">Shop</a>
    <a>About</a>
  </div>
  <button class="cart-btn" onclick="openCart()">
    🛒 Cart: <span id="cartCount">0</span>
  </button>
</nav>

<!-- HERO -->
<section class="hero" id="heroSection">
  <h1>Wear Your Junoon</h1>
  <p>Bold. Street. Premium Clothing Brand.</p>
  <button class="hero-btn" onclick="scrollToShop()">Shop Now</button>
</section>

<!-- STATS -->
<div class="stats">
  <div class="stat"><div class="stat-val" id="sTotal">0</div><div class="stat-lbl">Total Products</div></div>
  <div class="stat"><div class="stat-val" id="sCats">0</div><div class="stat-lbl">Categories</div></div>
  <div class="stat"><div class="stat-val" id="sCartQ">0</div><div class="stat-lbl">Items in Cart</div></div>
  <div class="stat"><div class="stat-val" id="sCartV">Rs 0</div><div class="stat-lbl">Cart Value</div></div>
  <div class="stat"><div class="stat-val" id="sAvg">0</div><div class="stat-lbl">Avg. Price</div></div>
</div>

<!-- SEARCH -->
<section class="search-area" id="shopSection">
  <div class="search-wrap">
    <span class="search-ico">🔍</span>
    <input class="search-input" id="searchInput" type="text"
      placeholder="Search products…" oninput="filterProducts()">
  </div>
  <div class="filters" id="filterRow"></div>
</section>

<!-- SECTION TITLE -->
<div class="sec-head">
  <span class="sec-title" id="secTitle">Our Collection</span>
  <span class="sec-count" id="secCount"></span>
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

<!-- CART OVERLAY + DRAWER -->
<div class="overlay" id="overlay" onclick="closeCart()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-top">
    <span class="drawer-title">Your Cart</span>
    <button class="drawer-close" onclick="closeCart()">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody">
    <div class="drawer-empty"><div class="drawer-empty-icon">🛒</div><p>Your cart is empty</p></div>
  </div>
  <div class="drawer-foot">
    <div class="total-row">
      <span class="total-lbl">Total</span>
      <span class="total-val" id="drawerTotal">Rs 0</span>
    </div>
    <button class="checkout-btn" onclick="checkout()">Proceed to Checkout →</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- FOOTER -->
<footer>
  <span class="foot-logo">JUNOON</span>
  <span class="foot-txt">© 2024 Junoon Clothing · Karachi, Pakistan</span>
  <span class="foot-txt">Bold. Street. Premium.</span>
</footer>

<script>
// Real Unsplash image URLs for men's clothing (free to use)
const products = [
  {
    id:1, name:"Classic White Polo",
    img:"https://images.unsplash.com/photo-1586790170083-2f9ceadc732d?w=600&q=80",
    cat:"T-Shirts", price:2800, stars:"4.8 ★",
    desc:"Premium pique cotton, ribbed collar, relaxed fit for everyday wear.",
    isNew:true, isSale:false
  },
  {
    id:2, name:"Black Slim-Fit Shirt",
    img:"https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=600&q=80",
    cat:"Shirts", price:3500, stars:"4.7 ★",
    desc:"Stretch cotton blend, slim silhouette, button-down collar.",
    isNew:true, isSale:false
  },
  {
    id:3, name:"Oversized Graphic Tee",
    img:"https://images.unsplash.com/photo-1529374255404-311a2a4f1fd9?w=600&q=80",
    cat:"T-Shirts", price:1800, stars:"4.6 ★",
    desc:"100% cotton, dropped shoulders, bold front print.",
    isNew:false, isSale:true
  },
  {
    id:4, name:"Cargo Jogger Pants",
    img:"https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=600&q=80",
    cat:"Bottoms", price:4200, stars:"4.5 ★",
    desc:"Ripstop fabric, tapered leg, multiple utility pockets.",
    isNew:false, isSale:false
  },
  {
    id:5, name:"Navy Blue Hoodie",
    img:"https://images.unsplash.com/photo-1556821840-3a63f15732ce?w=600&q=80",
    cat:"Hoodies", price:5500, stars:"4.9 ★",
    desc:"Brushed fleece interior, kangaroo pocket, relaxed fit.",
    isNew:true, isSale:false
  },
  {
    id:6, name:"Denim Jacket",
    img:"https://images.unsplash.com/photo-1543076447-215ad9ba6923?w=600&q=80",
    cat:"Jackets", price:8900, stars:"4.8 ★",
    desc:"Washed blue denim, classic trucker style, chest pockets.",
    isNew:false, isSale:false
  },
  {
    id:7, name:"Linen Kurta – Beige",
    img:"https://images.unsplash.com/photo-1594938298603-c8148c4dae35?w=600&q=80",
    cat:"Kurtas", price:3200, stars:"4.7 ★",
    desc:"Pure linen, mandarin collar, straight hem with side slits.",
    isNew:true, isSale:false
  },
  {
    id:8, name:"Olive Bomber Jacket",
    img:"https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=600&q=80",
    cat:"Jackets", price:9800, stars:"4.8 ★",
    desc:"Nylon shell, ribbed cuffs and hem, zip-through front.",
    isNew:false, isSale:true
  },
  {
    id:9, name:"Stripe Oxford Shirt",
    img:"https://images.unsplash.com/photo-1607345366928-199ea26cfe3e?w=600&q=80",
    cat:"Shirts", price:3100, stars:"4.5 ★",
    desc:"Oxford weave cotton, button-down collar, regular fit.",
    isNew:false, isSale:false
  },
  {
    id:10, name:"Slim Chino Trousers",
    img:"https://images.unsplash.com/photo-1473966968600-fa801b869a1a?w=600&q=80",
    cat:"Bottoms", price:4600, stars:"4.6 ★",
    desc:"Stretch twill, slim tapered cut, five-pocket styling.",
    isNew:false, isSale:false
  },
  {
    id:11, name:"Zip-Up Sweatshirt",
    img:"https://images.unsplash.com/photo-1614251056798-0a63eda2bb25?w=600&q=80",
    cat:"Hoodies", price:4800, stars:"4.7 ★",
    desc:"French terry fleece, full-zip front, ribbed hem and cuffs.",
    isNew:true, isSale:false
  },
  {
    id:12, name:"Embroidered Kurta – White",
    img:"https://images.unsplash.com/photo-1583744946564-b52ac1c389c8?w=600&q=80",
    cat:"Kurtas", price:5200, stars:"4.9 ★",
    desc:"Fine cotton with hand-embroidered neckline, regular fit.",
    isNew:true, isSale:false
  }
];

let cart = [];
let activeFilter = "All";

function init() {
  buildFilters();
  renderProducts(products);
  updateStats();
}

function buildFilters() {
  const cats = ["All", ...new Set(products.map(p => p.cat))];
  document.getElementById("filterRow").innerHTML = cats.map(c =>
    `<button class="f-tag ${c==="All"?"active":""}" onclick="setFilter('${c}',this)">${c}</button>`
  ).join("");
}

function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll(".f-tag").forEach(b => b.classList.remove("active"));
  if(btn) btn.classList.add("active");
  filterProducts();
}

function filterProducts() {
  const q = document.getElementById("searchInput").value.toLowerCase().trim();
  let list = products;
  if(activeFilter !== "All") list = list.filter(p => p.cat === activeFilter);
  if(q) list = list.filter(p =>
    p.name.toLowerCase().includes(q) ||
    p.cat.toLowerCase().includes(q) ||
    p.desc.toLowerCase().includes(q)
  );
  const title = q ? `Results for "${q}"` : (activeFilter === "All" ? "Our Collection" : activeFilter);
  document.getElementById("secTitle").textContent = title;
  renderProducts(list);
}

function renderProducts(list) {
  document.getElementById("secCount").textContent = `${list.length} item${list.length!==1?"s":""}`;
  const grid = document.getElementById("grid");
  if(!list.length) {
    grid.innerHTML = `<div class="no-res"><div class="no-res-icon">🔍</div><p>No products found</p></div>`;
    return;
  }
  grid.innerHTML = list.map(p => {
    const inCart = cart.find(c => c.id === p.id);
    return `
    <div class="card">
      <div class="card-img-wrap">
        <img class="card-img" src="${p.img}" alt="${p.name}" loading="lazy"
          onerror="this.style.background='#1e1e1e';this.style.display='flex';this.style.alignItems='center';this.style.justifyContent='center'">
        <div class="card-badges">
          ${p.isNew ? `<span class="badge badge-new">New</span>` : ""}
          ${p.isSale ? `<span class="badge badge-sale">Sale</span>` : ""}
        </div>
      </div>
      <div class="card-body">
        <div class="card-cat">${p.cat}</div>
        <div class="card-name">${p.name}</div>
        <div class="card-desc">${p.desc}</div>
        <div class="card-row">
          <span class="card-price">Rs ${p.price.toLocaleString()}</span>
          <span class="card-stars">${p.stars}</span>
        </div>
        <button class="add-btn ${inCart?"added":""}" id="btn-${p.id}" onclick="addToCart(${p.id})">
          ${inCart ? "✓ Added to Cart" : "+ Add to Cart"}
        </button>
      </div>
    </div>`;
  }).join("");
}

function addToCart(id) {
  const p = products.find(x => x.id === id);
  const ex = cart.find(c => c.id === id);
  if(ex) ex.qty++;
  else cart.push({...p, qty:1});
  updateCartUI(); updateStats();
  showToast(`"${p.name}" added to cart`);
  const btn = document.getElementById(`btn-${id}`);
  if(btn){ btn.classList.add("added"); btn.textContent = "✓ Added to Cart"; }
}

function removeFromCart(id) {
  cart = cart.filter(c => c.id !== id);
  updateCartUI(); updateStats(); filterProducts();
}

function changeQty(id, d) {
  const item = cart.find(c => c.id === id);
  if(!item) return;
  item.qty += d;
  if(item.qty <= 0){ removeFromCart(id); return; }
  updateCartUI(); updateStats();
}

function updateCartUI() {
  const totalVal = cart.reduce((s,c) => s + c.price*c.qty, 0);
  const totalQty = cart.reduce((s,c) => s + c.qty, 0);
  document.getElementById("cartCount").textContent = totalQty;
  document.getElementById("drawerTotal").textContent = "Rs " + totalVal.toLocaleString();
  const body = document.getElementById("drawerBody");
  if(!cart.length) {
    body.innerHTML = `<div class="drawer-empty"><div class="drawer-empty-icon">🛒</div><p>Your cart is empty</p></div>`;
    return;
  }
  body.innerHTML = cart.map(item => `
    <div class="ci">
      <img src="${item.img}" alt="${item.name}" onerror="this.style.display='none'">
      <div class="ci-info">
        <div class="ci-name">${item.name}</div>
        <div class="ci-price">Rs ${(item.price*item.qty).toLocaleString()}</div>
        <div class="ci-ctrl">
          <button class="q-btn" onclick="changeQty(${item.id},-1)">−</button>
          <span class="q-n">${item.qty}</span>
          <button class="q-btn" onclick="changeQty(${item.id},1)">+</button>
          <button class="ci-rm" onclick="removeFromCart(${item.id})">Remove</button>
        </div>
      </div>
    </div>`).join("");
}

function updateStats() {
  const totalVal = cart.reduce((s,c) => s + c.price*c.qty, 0);
  const totalQty = cart.reduce((s,c) => s + c.qty, 0);
  const avg = Math.round(products.reduce((s,p) => s + p.price, 0) / products.length);
  const cats = new Set(products.map(p => p.cat)).size;
  document.getElementById("sTotal").textContent = products.length;
  document.getElementById("sCats").textContent = cats;
  document.getElementById("sCartQ").textContent = totalQty;
  document.getElementById("sCartV").textContent = totalVal ? "Rs "+totalVal.toLocaleString() : "Rs 0";
  document.getElementById("sAvg").textContent = "Rs "+avg.toLocaleString();
}

function openCart() {
  document.getElementById("drawer").classList.add("open");
  document.getElementById("overlay").classList.add("open");
}
function closeCart() {
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("overlay").classList.remove("open");
}

function checkout() {
  if(!cart.length){ showToast("Your cart is empty!"); return; }
  const total = cart.reduce((s,c) => s + c.price*c.qty, 0);
  const items = cart.reduce((s,c) => s + c.qty, 0);
  alert(`✅ Order Placed!\n\nItems: ${items}\nTotal: Rs ${total.toLocaleString()}\n\nThank you for shopping at JUNOON!\nWe'll contact you for delivery. 🚀`);
  cart=[]; updateCartUI(); updateStats(); filterProducts(); closeCart();
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2600);
}

function scrollToShop() {
  document.getElementById("shopSection").scrollIntoView({behavior:"smooth"});
}
function scrollToTop() {
  window.scrollTo({top:0, behavior:"smooth"});
}

init();
</script>
</body>
</html>
